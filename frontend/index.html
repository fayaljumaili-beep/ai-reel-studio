<!DOCTYPE html>
<html>
<head>
  <title>AI Reel Studio</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      padding: 30px;
      border-radius: 20px;
      background: #111;
      text-align: center;
      width: 300px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(to right, pink, purple);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    video {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>AI Reel Studio</h2>

    <input id="prompt" placeholder="Enter idea..." />
    <button onclick="generate()">Generate</button>

    <p id="status"></p>
    <video id="video" controls></video>
  </div>

  <script>
async function generate() {
  const status = document.getElementById("status");
  const video = document.getElementById("video");

  status.innerText = "⏳ Generating...";
  video.style.display = "none";

  try {
    const res = await fetch(
      "https://ai-reel-studio-production.up.railway.app/generate-video",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          prompt: document.getElementById("prompt").value,
        }),
      }
    );

    console.log("STATUS:", res.status);

    const data = await res.json();
    console.log("DATA:", data);

    if (data.videoUrl) {
      status.innerText = "✅ Done!";
      video.src =
        "https://ai-reel-studio-production.up.railway.app" +
        data.videoUrl;
      video.style.display = "block";
      video.load();
      video.play();
    } else {
      status.innerText = "❌ Error";
    }
  } catch (err) {
    console.error(err);
    status.innerText = "❌ Failed";
  }
}
</script>
</body>
</html>
