<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Reel Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 20px;
      border-radius: 16px;
      background: #111;
      box-shadow: 0 0 30px rgba(255, 0, 150, 0.3);
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #ff00cc, #3333ff);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
    }

    #videoContainer {
      margin-top: 20px;
      text-align: left;
    }

    .scene {
      margin-bottom: 25px;
    }

    .scene p {
      margin-bottom: 10px;
      font-size: 14px;
    }

    video {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>AI Reel Studio</h1>

    <input id="prompt" placeholder="Enter your idea..." /> 
    <button onclick="generate()">Generate</button> 
    <div id="status" class="status"></div> 
    <video id="video" controls></video> 
    <pre id="script"></pre>

    <!-- 🔥 MULTI SCENE OUTPUT -->
    <div id="videoContainer"></div>
  </div>

  <script>
    async function generate() {
      const prompt = document.getElementById("prompt").value;
      const status = document.getElementById("status");
      const container = document.getElementById("videoContainer");

      if (!prompt) {
        status.innerText = "⚠️ Enter a prompt";
        return;
      }

      status.innerText = "🎬 Generating...";
      container.innerHTML = "";

      try {
        const response = await fetch("https://ai-reel-studio-production.up.railway.app/generate-video", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        console.log("Response:", data);

        if (!data.scenes) {
          status.innerText = "❌ No scenes returned";
          return;
        }

        status.innerText = "✅ Done!";

        // 🔥 LOOP THROUGH SCENES
        data.scenes.forEach(scene => {
          const wrapper = document.createElement("div");
          wrapper.className = "scene";

          const text = document.createElement("p");
          text.innerText = scene.text;

          const vid = document.createElement("video");
          vid.src = scene.video;
          vid.controls = true;

          wrapper.appendChild(text);
          wrapper.appendChild(vid);

          container.appendChild(wrapper);
        });

      } catch (err) {
        console.error(err);
        status.innerText = "❌ Error";
      }
    }
  </script>

</body>
</html>
