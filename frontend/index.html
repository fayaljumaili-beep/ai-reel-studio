<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Reel Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 20px;
      border-radius: 16px;
      background: #111;
      box-shadow: 0 0 30px rgba(255, 0, 150, 0.3);
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #ff00aa, #6a00ff);
      color: white;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    video {
      margin-top: 20px;
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>AI Reel Studio</h1>

    <input id="prompt" placeholder="Enter your idea..." />

    <button onclick="generate()">Generate</button>

    <p id="status"></p>

    <video id="video" controls></video>
  </div>

  <script src="index.js"></script>
</body>
</html>
