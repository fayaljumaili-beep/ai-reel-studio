<!DOCTYPE html>
<html>
<head>
  <title>AI Reel Studio</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      margin-top: 50px;
    }

    .card {
      width: 320px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, pink, purple);
      color: white;
      font-weight: bold;
    }

    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
    }

    #script {
      margin-top: 15px;
      text-align: left;
      white-space: pre-line;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>AI Reel Studio</h2>

    <input id="prompt" placeholder="Enter topic..." />
    <button onclick="generate()">Generate</button>

    <p id="status"></p>

    <video id="video" controls></video>
    <div id="script"></div>
  </div>

<script>
async function generate() {
  const status = document.getElementById("status");
  const video = document.getElementById("video");
  const scriptBox = document.getElementById("script");

  status.innerText = "⏳ Generating...";
  video.src = "";
  scriptBox.innerText = "";

  try {
    const res = await fetch("https://ai-reel-studio-production.up.railway.app/generate-video", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: document.getElementById("prompt").value
      })
    });

    const data = await res.json();

    video.src = "https://ai-reel-studio-production.up.railway.app" + data.videoUrl;
    scriptBox.innerText = data.script;

    status.innerText = "✅ Done!";
  } catch (err) {
    console.error(err);
    status.innerText = "❌ Failed";
  }
}
</script>

</body>
</html>
