<!DOCTYPE html>
<html>
<head>
  <title>AI Reel Studio</title>
  <style>
    body {
      margin: 0;
      background: black;
      font-family: Arial;
      color: white;
      overflow: hidden;
    }

    #controls {
      position: fixed;
      top: 20px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    input {
      padding: 10px;
      width: 200px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }

    #feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .video-card {
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      height: 100%;
    }

    .caption {
      position: absolute;
      bottom: 80px;
      left: 20px;
      right: 20px;
      font-size: 14px;
    }

    .download {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: white;
      color: black;
      padding: 8px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div id="controls">
  <input id="prompt" placeholder="Enter topic..." />
  <button onclick="generate()">Generate 3 Reels</button>
</div>

<div id="feed"></div>

<script src="index.js"></script>
</body>
</html>
