<!DOCTYPE html>
<html>
<head>
  <title>AI Reel Studio</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      padding: 30px;
      border-radius: 20px;
      background: #111;
      text-align: center;
      width: 300px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(to right, pink, purple);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    video {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>AI Reel Studio</h2>

    <input id="prompt" placeholder="Enter idea..." />
    <button onclick="generate()">Generate</button>

    <p id="status"></p>
    <video id="video" controls></video>
  </div>

  <script>
    async function generate() {
      const prompt = document.getElementById("prompt").value;
      const status = document.getElementById("status");
      const video = document.getElementById("video");

      status.innerText = "⏳ Generating...";
      video.src = "";

      try {
        const res = await fetch(
          "https://YOUR-RAILWAY-URL.up.railway.app/generate-video",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ prompt }),
          }
        );

        const data = await res.json();

        if (data.videoUrl) {
          status.innerText = "✅ Done!";
          video.src =
            "https://https://ai-reel-studio-production.up.railway.app/" + data.videoUrl;
        } else {
          status.innerText = "❌ Error";
        }
      } catch (err) {
        console.error(err);
        status.innerText = "❌ Failed";
      }
    }
  </script>
</body>
</html>
