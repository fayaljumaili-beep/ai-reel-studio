<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Reel Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
    }

    .card {
      background: #111;
      padding: 20px;
      border-radius: 20px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 200, 0.2);
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, #ff7cf0, #a100ff);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
    }

    /* 🎬 SCRIPT STYLE (paragraph, not bullets) */
    #scriptBox {
      margin-top: 14px;
      text-align: left;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-line; /* keeps paragraph formatting */
      opacity: 0.95;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>AI Reel Studio</h2>

    <input id="prompt" placeholder="Enter prompt..." />
    <button onclick="generate()">Generate</button>

    <div id="status"></div>

    <video id="video" controls></video>

    <!-- 🧠 SCRIPT OUTPUT -->
    <div id="scriptBox"></div>
  </div>

  <script>
    async function generate() {
      const prompt = document.getElementById("prompt").value;
      const status = document.getElementById("status");
      const video = document.getElementById("video");
      const scriptBox = document.getElementById("scriptBox");

      try {
        status.innerText = "⏳ Generating...";
        video.src = "";
        scriptBox.innerText = "";

        const res = await fetch(
          "https://ai-reel-studio-production.up.railway.app/generate-video",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ prompt })
          }
        );

        console.log("STATUS:", res.status);

        const data = await res.json();
        console.log("DATA:", data);

        if (data.videoUrl) {
          status.innerText = "✅ Done!";

          video.src =
            "https://ai-reel-studio-production.up.railway.app" +
            data.videoUrl;

          video.load();
          video.play();
        } else {
          status.innerText = "❌ Failed";
        }

        // 🧠 SHOW FULL SCRIPT (NOT BULLETS)
        if (data.script) {
          scriptBox.innerText = data.script;
        }

      } catch (err) {
        console.error(err);
        status.innerText = "❌ Error";
      }
    }
  </script>
</body>
</html>
