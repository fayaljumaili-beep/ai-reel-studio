<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Reel Generator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #ff004f;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button:hover {
      background: #ff2a6d;
    }

    #statusText {
      text-align: center;
      margin-bottom: 10px;
      font-size: 14px;
    }

    #videoContainer {
      width: 100%;
      margin-top: 10px;
    }

    video {
      width: 100%;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>🎬 AI Reel Generator</h1>

    <!-- INPUT -->
    <input 
      id="ideaInput" 
      placeholder="e.g. luxury lifestyle morning routine" 
    />

    <!-- BUTTON -->
    <button id="generateBtn">Generate</button>

    <!-- STATUS -->
    <p id="statusText"></p>

    <!-- VIDEO OUTPUT -->
    <div id="videoContainer"></div>
  </div>

  <!-- SCRIPT -->
  <script src="index.js"></script>
</body>
</html>
