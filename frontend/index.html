<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Reel Studio</title>

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    input {
      width: 80%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(45deg, pink, purple);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    video {
      width: 300px;
      border-radius: 15px;
      margin-top: 20px;
    }

    #captions {
      margin-top: 20px;
      font-size: 16px;
      line-height: 1.6;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
    }

    .word.active {
      color: #ff4dff;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>AI Reel Studio</h1>

  <input id="prompt" placeholder="Enter your idea..." />
  <br />
  <button onclick="generate()">Generate</button>

  <p id="status"></p>

  <!-- 🎬 VIDEO -->
  <video id="video" controls></video>

  <!-- 🔊 AUDIO -->
  <audio id="audio"></audio>

  <!-- 📝 CAPTIONS -->
  <div id="captions"></div>

  <!-- JS -->
  <script src="index.js"></script>

</body>
</html>
