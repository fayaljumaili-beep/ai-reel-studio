<!DOCTYPE html>
<html>
<head>
  <title>AI Reel Studio</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
    }

    input {
      padding: 10px;
      width: 80%;
      border-radius: 10px;
      border: none;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(to right, pink, purple);
      color: white;
      cursor: pointer;
    }

    video {
      margin-top: 20px;
      width: 300px;
      border-radius: 10px;
    }

    #script {
      margin-top: 20px;
      text-align: left;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>

<body>

  <h1>AI Reel Studio</h1>

  <input id="prompt" placeholder="Enter topic..." />
  <br>
  <button onclick="generate()">Generate</button>

  <p id="status"></p>

  <video id="video" controls></video>

  <div id="script"></div>

  <script>
    async function generate() {
      const prompt = document.getElementById("prompt").value;

      const status = document.getElementById("status");
      const video = document.getElementById("video");
      const scriptBox = document.getElementById("script");

      status.innerText = "⏳ Generating...";
      scriptBox.innerText = "";

      try {
        const res = await fetch("https://ai-reel-studio-production.up.railway.app/generate-video", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt })
        });

        const data = await res.json();

        console.log(data); // DEBUG

        // IMPORTANT: use backend video URL
        video.src = data.videoUrl;

        // show script
        scriptBox.innerText = data.script || "No script returned";

        status.innerText = "✅ Done!";
      } catch (err) {
        console.error(err);
        status.innerText = "❌ Error";
      }
    }
  </script>

</body>
</html>
