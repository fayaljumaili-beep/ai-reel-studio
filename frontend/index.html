<!DOCTYPE html>
<html>
<head>
  <title>AI Reel Studio</title>

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: -apple-system;
      color: white;
    }

    #controls {
      position: fixed;
      top: 15px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 10;
      flex-wrap: wrap;
    }

    input, select {
      padding: 12px;
      border-radius: 20px;
      border: none;
      background: #111;
      color: white;
    }

    button {
      padding: 12px 18px;
      border-radius: 20px;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    #feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .video-card {
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
    }

    video {
      height: 100%;
      width: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      bottom: 0;
      padding: 20px;
      background: linear-gradient(transparent, black);
      width: 100%;
    }

    .hook {
      font-size: 22px;
      font-weight: bold;
    }

    .caption {
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div id="controls">
  <input id="prompt" placeholder="Topic..." />

  <select id="theme">
    <option>motivation</option>
    <option>wealth</option>
    <option>fitness</option>
  </select>

  <select id="scenario">
    <option>city</option>
    <option>office</option>
    <option>gym</option>
  </select>

  <select id="emotion">
    <option>inspiring</option>
    <option>aggressive</option>
    <option>luxury</option>
  </select>

  <select id="duration">
    <option>20 seconds</option>
    <option>30 seconds</option>
    <option>45 seconds</option>
  </select>

  <button onclick="generate()">Generate</button>
</div>

<div id="feed"></div>

<script src="index.js" defer></script>

</body>
</html>
