<!DOCTYPE html>
<html>
<head>
  <title>AI Reel Studio</title>

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: -apple-system, sans-serif;
      color: white;
      overflow: hidden;
    }

    #controls {
      position: fixed;
      top: 10px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 10;
    }

    input {
      padding: 12px;
      border-radius: 20px;
      border: none;
      width: 220px;
      background: #111;
      color: white;
    }

    button {
      padding: 12px 18px;
      border-radius: 20px;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    #feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .video-card {
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      height: 100%;
      object-fit: cover;
    }

    .caption {
      position: absolute;
      bottom: 100px;
      left: 16px;
      right: 16px;
      font-size: 14px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      padding: 20px;
      border-radius: 10px;
    }

    .download {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: white;
      color: black;
      padding: 10px;
      border-radius: 50%;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="controls">
    <input id="prompt" placeholder="Enter topic..." />
    <button onclick="generate()">Generate 3 Reels</button>
  </div>

  <div id="feed"></div>

  <script src="index.js"></script>

</body>
</html>
