<!DOCTYPE html>
<html>
<head>
  <title>AI Reel Studio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0a0a0a;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
    }

    input {
      padding: 12px;
      width: 250px;
      margin: 10px;
    }

    button {
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
    }

    #videos {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .card {
      background: #111;
      padding: 15px;
      border-radius: 10px;
      width: 260px;
    }

    video {
      width: 100%;
      border-radius: 10px;
    }

    .caption {
      font-size: 12px;
      margin-top: 10px;
      text-align: left;
    }

    .download {
      display: block;
      margin-top: 10px;
      padding: 8px;
      background: white;
      color: black;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>🔥 AI Reel Studio</h1>

  <input id="prompt" placeholder="Enter topic (e.g. success mindset)">
  <br>
  <button id="generateBtn" onclick="generate()">Generate 3 Reels</button>

  <p id="status"></p>

  <div id="results"></div>

  <script src="index.js"></script>

</body>
</html>
