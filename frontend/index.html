<!DOCTYPE html>
<html>
<head>
  <title>AI Reel Studio</title>

  <style>
    body {
      background: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
    }

    input {
      padding: 10px;
      width: 80%;
      border-radius: 10px;
      border: none;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(to right, pink, purple);
      color: white;
      cursor: pointer;
    }

    video {
      margin-top: 20px;
      width: 300px;
      border-radius: 10px;
    }

    #captions {
      margin-top: 20px;
      font-size: 18px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h1>AI Reel Studio</h1>

  <input id="prompt" placeholder="Enter topic..." />
  <br>
  <button onclick="generate()">Generate</button>

  <p id="status"></p>

  <video id="video" controls></video>

  <div id="captions"></div>

  <script>
    async function generate() {
      const prompt = document.getElementById("prompt").value;

      const status = document.getElementById("status");
      const video = document.getElementById("video");
      const captions = document.getElementById("captions");

      status.innerText = "⏳ Generating...";
      captions.innerText = "";

      try {
        const res = await fetch("https://ai-reel-studio-production.up.railway.app/generate-video", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt })
        });

        const data = await res.json();

        console.log(data);

        // 🎥 load video
        video.src = data.videoUrl;

        // 🎙️ play voice
        const audio = new Audio(data.audioUrl);
        audio.play();

        // 📝 captions
        showCaptions(data.script);

        status.innerText = "✅ Done!";

      } catch (err) {
        console.error(err);
        status.innerText = "❌ Error";
      }
    }

    function showCaptions(script) {
      const words = script.split(" ");
      let i = 0;

      const captions = document.getElementById("captions");

      const interval = setInterval(() => {
        captions.innerText += words[i] + " ";
        i++;

        if (i >= words.length) {
          clearInterval(interval);
        }
      }, 180);
    }
  </script>

</body>
</html>
