<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Reel Studio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 360px;
      padding: 20px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(45deg, pink, purple);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
    }

    #captions {
      margin-top: 15px;
      font-size: 16px;
      line-height: 1.5;
    }

    #status {
      margin-top: 10px;
    }

    .highlight {
      color: #ff4dff;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="app">
    <h2>AI Reel Studio</h2>

    <input id="prompt" placeholder="Enter your idea..." />
    <button onclick="generate()">Generate</button>

    <div id="status"></div>

    <video id="video" playsinline muted></video>

    <div id="captions"></div>
  </div>

<script>
const API = "https://ai-reel-studio-production.up.railway.app";

async function generate() {
  const status = document.getElementById("status");
  const video = document.getElementById("video");
  const captions = document.getElementById("captions");

  status.innerText = "⚡ Generating...";
  captions.innerHTML = "";

  try {
    const res = await fetch(API + "/generate-video", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: document.getElementById("prompt").value
      })
    });

    const data = await res.json();

    // 🎥 set video immediately
    video.src = data.videoUrl + "?t=" + Date.now(); // cache bust
    video.load();

    // 🎙️ create audio
    const audio = new Audio(data.audioUrl + "?t=" + Date.now());
    audio.preload = "auto";

    // 🚀 START EVERYTHING IMMEDIATELY (NO WAIT)
    setTimeout(() => {
      video.currentTime = 0;

      video.play().catch(() => {});
      audio.play().catch(() => {});

      showCaptions(data.script);

      status.innerText = "✅ Done!";
    }, 300); // small delay = smoother start

  } catch (err) {
    console.error(err);
    status.innerText = "❌ Error";
  }
}

function showCaptions(script) {
  const captions = document.getElementById("captions");

  const words = script
    .replace(/\n/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .split(" ");

  let i = 0;

  const interval = setInterval(() => {
    captions.innerHTML = words
      .map((w, index) => {
        return index === i
          ? `<span style="color:#ff4dff;font-weight:bold">${w}</span>`
          : `<span style="opacity:0.6">${w}</span>`;
      })
      .join(" ");

    i++;

    if (i >= words.length) clearInterval(interval);
  }, 120);
}
</script>

</body>
</html>
