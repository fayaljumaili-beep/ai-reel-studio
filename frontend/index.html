<!DOCTYPE html>
<html>
<head>
<title>AI Reel Studio</title>

<style>
body { margin:0; background:black; color:white; font-family:sans-serif; }

#panel {
  position:fixed;
  top:10px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  z-index:10;
}

select, input, button {
  padding:10px;
  border-radius:20px;
  border:none;
  background:#111;
  color:white;
}

button { background:white; color:black; cursor:pointer; }

#feed {
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.video-card {
  height:100vh;
  position:relative;
  scroll-snap-align:start;
}

video { width:100%; height:100%; object-fit:cover; }

.hook {
  position:absolute;
  top:40%;
  left:20px;
  right:20px;
  font-size:28px;
  font-weight:800;
}

.meta {
  position:absolute;
  bottom:80px;
  left:16px;
  right:16px;
  font-size:13px;
  background:rgba(0,0,0,0.5);
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div id="panel">
  <input id="prompt" placeholder="Topic" />

  <select id="scenario">
    <option>story</option>
    <option>motivation</option>
    <option>educational</option>
    <option>controversial</option>
  </select>

  <select id="theme">
    <option>rich mindset</option>
    <option>fitness</option>
    <option>business</option>
    <option>self improvement</option>
  </select>

  <select id="voice">
    <option value="male">male</option>
    <option value="female">female</option>
    <option value="deep">deep</option>
  </select>

  <button onclick="generate()">Generate</button>
</div>

<div id="feed"></div>

<script src="index.js" defer></script>

</body>
</html>
