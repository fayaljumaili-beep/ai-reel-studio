<!DOCTYPE html>
<html>
<head>
  <title>AI Reel Studio</title>

  <style>
    body {
      margin: 0;
      background: black;
      font-family: -apple-system;
      color: white;
    }

    #controls {
      position: fixed;
      top: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 10;
    }

    select, input {
      padding: 10px;
      border-radius: 20px;
      border: none;
      background: #111;
      color: white;
    }

    button {
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    #feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .video-card {
      height: 100vh;
      scroll-snap-align: start;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .caption {
      position: absolute;
      bottom: 80px;
      left: 20px;
      right: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="controls">
  <input id="prompt" placeholder="Enter topic..." />

  <select id="scenario">
    <option>rich lifestyle</option>
    <option>motivation</option>
    <option>fitness</option>
  </select>

  <select id="tone">
    <option>inspiring</option>
    <option>aggressive</option>
    <option>calm</option>
  </select>

  <button onclick="generate()">Generate</button>
</div>

<div id="feed"></div>

<script src="index.js"></script>
</body>
</html>
