<!DOCTYPE html>
<html>
<head>
  <title>AI Reel Studio</title>

  <style>
    body {
      margin: 0;
      background: black;
      font-family: -apple-system, sans-serif;
      color: white;
      overflow: hidden;
    }

    #controls {
      position: fixed;
      top: 15px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 20;
    }

    input {
      padding: 14px;
      border-radius: 999px;
      border: none;
      width: 260px;
      background: rgba(255,255,255,0.08);
      color: white;
      backdrop-filter: blur(10px);
    }

    button {
      padding: 14px 20px;
      border-radius: 999px;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .brand {
      position: fixed;
      top: 60px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      letter-spacing: 3px;
      opacity: 0.6;
    }

    #feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .video-card {
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hook {
      position: absolute;
      top: 40%;
      left: 20px;
      right: 20px;
      font-size: 28px;
      font-weight: 800;
      text-shadow: 0 4px 20px black;
    }

    .meta {
      position: absolute;
      bottom: 100px;
      left: 16px;
      right: 16px;
      font-size: 13px;
      background: rgba(0,0,0,0.4);
      padding: 12px;
      border-radius: 12px;
    }

    .download {
      position: absolute;
      bottom: 30px;
      right: 20px;
      background: white;
      color: black;
      padding: 10px;
      border-radius: 50%;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div id="controls">
  <input id="prompt" placeholder="Enter topic..." />
  <button onclick="generate()">Generate</button>
</div>

<div class="brand">AI REEL STUDIO</div>
<div id="feed"></div>

<script src="index.js" defer></script>

</body>
</html>
