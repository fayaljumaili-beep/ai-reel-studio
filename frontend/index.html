<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Reel Studio</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(45deg, #ff4dff, #6a00ff);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
    }

    .video-container {
      position: relative;
      margin-top: 20px;
    }

    video {
      width: 100%;
      border-radius: 15px;
    }

    #captions {
      position: absolute;
      bottom: 20px;
      width: 100%;
      padding: 0 10px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
    }

    .word {
      opacity: 0.5;
      margin-right: 4px;
    }

    .word.active {
      opacity: 1;
      color: #ff4dff;
    }

    audio {
      display: none;
    }
  </style>
</head>

<body>

  <h1>AI Reel Studio</h1>

  <div class="container">
    <input id="prompt" placeholder="Enter your idea..." />
    <button id="generateBtn" onclick="generate()">Generate</button>
    <p id="status"></p>

    <div class="video-container">
      <video id="video" playsinline></video>
      <div id="captions"></div>
    </div>

    <audio id="audio"></audio>
  </div>

  <!-- FRONTEND LOGIC -->
  <script src="index.js"></script>

</body>
</html>
