 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Reel Studio</title>

  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 30px;
      border-radius: 20px;
      background: #111;
      box-shadow: 0 0 30px rgba(255,0,150,0.3);
      width: 350px;
    }

    input {
      padding: 10px;
      width: 250px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, pink, purple);
      color: white;
      cursor: pointer;
    }

    #videos {
      margin-top: 20px;
    }

    video {
      width: 100%;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    pre {
      margin-top: 10px;
      color: red;
      font-size: 12px;
      text-align: left;
      overflow: auto;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>AI Reel Studio</h1>

  <input id="prompt" placeholder="Enter your niche (e.g. money, fitness)" />
  <br>
  <button id="generateBtn">Generate Batch</button>

  <p id="status"></p>
  <div id="videos"></div>
  <pre id="errorBox"></pre>
</div>

<script>
  const API_URL = "https://ai-reel-studio-production.up.railway.app";

  const button = document.getElementById("generateBtn");
  const status = document.getElementById("status");
  const videosContainer = document.getElementById("videos");
  const errorBox = document.getElementById("errorBox");

  button.onclick = async () => {
    try {
      const prompt = document.getElementById("prompt").value;

      if (!prompt) {
        alert("Enter a niche (money, fitness, etc)");
        return;
      }

      status.innerText = "⏳ Generating batch...";
      errorBox.innerText = "";
      videosContainer.innerHTML = "";
      button.disabled = true;

      // 🔥 STEP 1: get batch URLs
      const res = await fetch(
        `${API_URL}/generate-batch?niche=${encodeURIComponent(prompt)}`
      );

      if (!res.ok) {
        throw new Error(await res.text());
      }

      const data = await res.json();

      // 🔥 STEP 2: render videos one by one
      for (const url of data.videos) {
        const wrapper = document.createElement("div");

        const vid = document.createElement("video");
        vid.controls = true;
        vid.src = API_URL + url + "&t=" + Date.now();

        const label = document.createElement("p");
        label.innerText = "🎬 Generating...";

        wrapper.appendChild(label);
        wrapper.appendChild(vid);
        videosContainer.appendChild(wrapper);

        // when video loads
        vid.onloadeddata = () => {
          label.innerText = "✅ Ready";
        };
      }

      status.innerText = "🔥 Batch loaded!";
    } catch (err) {
      console.error(err);
      errorBox.innerText = err.message;
      status.innerText = "❌ Failed";
    } finally {
      button.disabled = false;
    }
  };
</script>

</body>
</html>
