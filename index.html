<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Reel Studio</title>

  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }

    .container {
      text-align: center;
      padding: 30px;
      border-radius: 20px;
      background: #111;
      box-shadow: 0 0 30px rgba(255,0,150,0.3);
      width: 350px;
    }

    input {
      padding: 10px;
      width: 250px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, pink, purple);
      color: white;
      cursor: pointer;
    }

    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>AI Reel Studio</h1>

  <input id="prompt" placeholder="Enter a niche..." />
  <br>
  <button id="btn">Generate</button>

  <p id="status"></p>
  <div id="videos"></div>
</div>

<script>
const API_URL = "https://ai-reel-studio-production.up.railway.app";

const btn = document.getElementById("btn");
const status = document.getElementById("status");
const videos = document.getElementById("videos");

btn.onclick = async () => {
  const niche = document.getElementById("prompt").value;

  if (!niche) return alert("Enter something");

  status.innerText = "🔥 Getting ideas...";
  videos.innerHTML = "";

  const res = await fetch(`${API_URL}/generate-batch?niche=${encodeURIComponent(niche)}`);
  const data = await res.json();

  const prompts = data.prompts || [];

  for (let i = 0; i < prompts.length; i++) {
    const p = prompts[i];

    status.innerText = `🎬 Video ${i + 1}/${prompts.length}`;

    const videoRes = await fetch(`${API_URL}/generate?niche=${encodeURIComponent(p)}`); 
    const blob = await videoRes.blob();
    const url = URL.createObjectURL(blob);

    const video = document.createElement("video");
    video.src = url;
    video.controls = true;

    videos.appendChild(video);
  }

  status.innerText = "✅ Done!";
};
</script>

</body>
</html>
